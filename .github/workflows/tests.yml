name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test environment
        run: script/setup_test_env.sh
      - name: Lint
        run: pipx run ruff check custom_components tests
      - name: Test
        run: python -m pytest -q
